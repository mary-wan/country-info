apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: country-information
  namespace: country-info
  labels:
    app: country-information
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: country-information
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
