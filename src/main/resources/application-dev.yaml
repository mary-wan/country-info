spring:
  datasource:
    url: jdbc:mysql://localhost:3306/country_information
    username: country
    password: country
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

country-info:
  soap:
    endpoint: http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
    connect-timeout: 5s
    read-timeout: 10s
  resilience:
    max-attempts: 3
    backoff: 500ms
    backoff-multiplier: 2.0
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    sliding-window-size: 10
    minimum-number-of-calls: 5
    permitted-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8080

logging:
  config: classpath:logback.xml
